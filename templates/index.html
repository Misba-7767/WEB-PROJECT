<!DOCTYPE html>
<html>
<head>
<title>Charity Jet</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(to right, #0f172a, #1e293b);
  color: white;
}

/* NAVBAR */
nav {
  display:flex;
  justify-content:space-between;
  padding:20px 50px;
  background:#020617;
}

nav a {
  color:white;
  margin-left:20px;
  text-decoration:none;
}

/* HERO */
.hero {
  height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  animation: fadeIn 2s;
}

.hero h1 {
  font-size:50px;
}

.hero p {
  margin-top:10px;
  font-size:20px;
  opacity:0.8;
}

.btn {
  margin-top:20px;
  padding:12px 25px;
  background:#22c55e;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:5px;
}

/* CARDS */
.cards {
  display:flex;
  justify-content:center;
  gap:30px;
  margin:50px;
}

.card {
  background:#1e293b;
  padding:20px;
  width:250px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.1);
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<nav>
  <h2>Charity Jet</h2>
  <div>
   <nav>
  <a href="/">Home</a>
  <a href="/about">About</a>
  <a href="/donatepage">Donate</a>
  <a href="/login">Login</a>
</nav>
  </div>
</nav>

<div class="hero">
  
  <section style="padding:100px; text-align:center;">
  <h1 style="font-size:50px;">Make a Difference Today</h1>
  <p>Support causes that matter ❤️</p>
  <a href="/donatepage">
    <button style="padding:15px 30px; background:#22c55e;">Donate Now</button>
  </a>
</section>
</div>

<div class="cards">
  <div class="card">
    <h3>🍲 Food</h3>
    <p>Provide meals to the needy</p>
  </div>

  <div class="card">
    <h3>📚 Education</h3>
    <p>Help children study</p>
  </div>

  <div class="card">
    <h3>🏥 Medical</h3>
    <p>Support healthcare</p>
  </div>
</div>

</body>
</html>
