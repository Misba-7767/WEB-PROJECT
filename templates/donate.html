<!DOCTYPE html>
<html>
<head>
    <title>Donate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

<!-- CARD -->
<div class="bg-slate-800 p-8 rounded-2xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-bold mb-6 text-center">Support the Cause 💖</h2>

    <input 
        id="username" 
        class="w-full p-3 mb-4 rounded bg-white text-black" 
        placeholder="Your Name"
    >

    <input 
        id="amount" 
        type="number" 
        class="w-full p-3 mb-6 rounded bg-white text-black" 
        placeholder="Enter Amount (₹)"
    >

    <button 
        onclick="payNow()" 
        class="bg-green-500 hover:bg-green-600 w-full py-3 rounded font-bold"
    >
        Donate Now 💳
    </button>

    <p class="text-center text-gray-400 mt-4 text-sm">
        Secure payment via Razorpay
    </p>

</div>

<!-- RAZORPAY -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function payNow() {

    let amount = document.getElementById("amount").value;
    let user = document.getElementById("username").value;

    if (!amount || !user) {
        alert("Please enter all fields");
        return;
    }

    fetch('/create_order', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: `amount=${amount}`
    })
    .then(res => res.json())
    .then(data => {

        var options = {
            key: "YOUR_KEY_ID",
            amount: amount * 100,
            currency: "INR",
            name: "DonateNow",
            description: "Support Donation",
            order_id: data.id,

            handler: function (response) {

                fetch('/verify_payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        order_id: response.razorpay_order_id,
                        payment_id: response.razorpay_payment_id,
                        signature: response.razorpay_signature,
                        user: user,
                        amount: amount
                    })
                })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        window.location.href = "/dashboard";
                    } else {
                        alert("Payment Failed ❌");
                    }
                });
            }
        };

        var rzp = new Razorpay(options);
        rzp.open();
    });
}
</script>

</body>
</html>
